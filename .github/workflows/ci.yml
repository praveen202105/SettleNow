name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: settleflow_test
          POSTGRES_PASSWORD: settleflow
          POSTGRES_USER: settleflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U settleflow -d settleflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgresql://settleflow:settleflow@127.0.0.1:5432/settleflow_test?schema=public
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: .local/ci-exports
      EMAIL_ENABLED: false
      TEST_DATABASE_URL: postgresql://settleflow:settleflow@127.0.0.1:5432/settleflow_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm --filter @settleflow/api exec prisma migrate status
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
