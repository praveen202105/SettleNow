services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: settleflow
      POSTGRES_USER: settleflow
      POSTGRES_PASSWORD: settleflow
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U settleflow -d settleflow']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - settleflow_postgres:/var/lib/postgresql/data
      - ./infra/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - settleflow_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: settleflow
      MINIO_ROOT_PASSWORD: settleflow-local-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - settleflow_minio:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'

volumes:
  settleflow_postgres:
  settleflow_redis:
  settleflow_minio:
